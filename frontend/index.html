<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production RAG</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #333; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const API = "http://localhost:8000/api/v1"

const s = {
  container: { maxWidth: 800, margin: "0 auto", padding: "40px 20px" },
  title: { fontSize: 28, fontWeight: 600, color: "#ffffff", marginBottom: 6 },
  subtitle: { fontSize: 14, color: "#888", marginBottom: 32 },
  card: { background: "#1a1a1a", border: "1px solid #2a2a2a", borderRadius: 12, padding: 24, marginBottom: 20 },
  sectionTitle: { fontSize: 16, fontWeight: 600, color: "#fff", marginBottom: 16 },
  uploadArea: { border: "2px dashed #333", borderRadius: 8, padding: 32, textAlign: "center", cursor: "pointer" },
  button: { background: "#7c3aed", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 500, cursor: "pointer", marginTop: 12 },
  buttonOff: { background: "#333", color: "#666", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, cursor: "not-allowed", marginTop: 12 },
  input: { width: "100%", background: "#111", border: "1px solid #2a2a2a", borderRadius: 8, padding: "12px 16px", fontSize: 15, color: "#e8e8e8", outline: "none", resize: "none", marginBottom: 12 },
  badge: { display: "inline-block", background: "#1e1e3a", border: "1px solid #3a3a6a", borderRadius: 6, padding: "4px 10px", fontSize: 12, color: "#a78bfa", marginTop: 10 },
  answerText: { fontSize: 15, lineHeight: 1.7, color: "#e8e8e8" },
  citationBox: { background: "#111", border: "1px solid #2a2a2a", borderRadius: 8, padding: 16, marginTop: 16 },
  citationLabel: { fontSize: 11, color: "#666", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 },
  citationText: { fontSize: 13, color: "#aaa", lineHeight: 1.6, fontStyle: "italic" },
  meta: { display: "flex", gap: 20, marginTop: 12, flexWrap: "wrap" },
  metaItem: { fontSize: 12, color: "#666" },
  metaValue: { color: "#e8e8e8", fontWeight: 500 },
  fallback: { background: "#1a0f0f", border: "1px solid #3a1a1a", borderRadius: 8, padding: 16, color: "#f87171", fontSize: 14, lineHeight: 1.6 },
  error: { background: "#1a0a0a", border: "1px solid #3a1a1a", borderRadius: 8, padding: 16, fontSize: 13, color: "#f87171", marginBottom: 16 },
  feedbackRow: { display: "flex", gap: 10, marginTop: 16, alignItems: "center" },
  feedbackLabel: { fontSize: 13, color: "#666" },
  feedbackBtn: { background: "#2a2a2a", border: "1px solid #333", borderRadius: 6, padding: "6px 14px", fontSize: 14, cursor: "pointer", color: "#e8e8e8" },
  status: { fontSize: 13, color: "#888", marginTop: 8 },
  confRow: { display: "flex", justifyContent: "space-between", marginBottom: 4 },
  confBar: { height: 6, borderRadius: 3, background: "#2a2a2a", marginTop: 12, overflow: "hidden" },
}

function ConfidenceBar({ value }) {
  const pct = Math.round((value || 0) * 100)
  const color = pct >= 70 ? "#4ade80" : pct >= 40 ? "#facc15" : "#f87171"
  return (
    <div>
      <div style={s.confRow}>
        <span style={{ fontSize: 12, color: "#666" }}>Confidence</span>
        <span style={{ fontSize: 12, color, fontWeight: 600 }}>{pct}%</span>
      </div>
      <div style={s.confBar}>
        <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 3, transition: "width 0.5s" }} />
      </div>
    </div>
  )
}

function App() {
  const [file, setFile] = React.useState(null)
  const [docId, setDocId] = React.useState(null)
  const [uploading, setUploading] = React.useState(false)
  const [uploadStatus, setUploadStatus] = React.useState(null)
  const [query, setQuery] = React.useState("")
  const [querying, setQuerying] = React.useState(false)
  const [result, setResult] = React.useState(null)
  const [error, setError] = React.useState(null)
  const [feedback, setFeedback] = React.useState(null)

  async function handleUpload() {
    if (!file) return
    setUploading(true)
    setUploadStatus("Uploading and ingesting...")
    setError(null)
    const formData = new FormData()
    formData.append("file", file)
    try {
      const res = await fetch(`${API}/upload`, { method: "POST", body: formData })
      const data = await res.json()
      if (!res.ok) throw new Error(data.detail || "Upload failed")
      setDocId(data.doc_id)
      setUploadStatus(`Done. ${data.chunks_stored} chunks from ${data.total_pages} pages in ${data.duration_seconds}s`)
    } catch(e) {
      setError(e.message)
      setUploadStatus(null)
    } finally {
      setUploading(false)
    }
  }

  async function handleQuery() {
    if (!query.trim()) return
    setQuerying(true)
    setResult(null)
    setError(null)
    setFeedback(null)
    try {
      const res = await fetch(`${API}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, doc_id: docId, top_k: 10, top_n: 5 }),
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.detail || "Query failed")
      setResult(data)
    } catch(e) {
      setError(e.message)
    } finally {
      setQuerying(false)
    }
  }

  async function handleFeedback(score) {
    if (!result?.log_id || feedback !== null) return
    setFeedback(score)
    try {
      await fetch(`${API}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ log_id: result.log_id, feedback: score }),
      })
    } catch(_) {}
  }

  return (
    <div style={s.container}>
      <div style={s.title}>Production RAG</div>
      <div style={s.subtitle}>Upload a document. Ask a question. Get a cited answer.</div>

      <div style={s.card}>
        <div style={s.sectionTitle}>1. Upload document</div>
        <label style={s.uploadArea}>
          <input type="file" accept=".pdf" style={{ display: "none" }}
            onChange={e => { setFile(e.target.files[0]); setDocId(null); setUploadStatus(null); }} />
          <div style={{ fontSize: 14, color: "#666" }}>{file ? file.name : "Click to upload a PDF"}</div>
        </label>
        {file && !docId && (
          <button style={uploading ? s.buttonOff : s.button} onClick={handleUpload} disabled={uploading}>
            {uploading && <span className="spinner" />}
            {uploading ? "Ingesting..." : "Ingest document"}
          </button>
        )}
        {uploadStatus && <div style={s.status}>{uploadStatus}</div>}
        {docId && <div style={s.badge}>doc_id: {docId}</div>}
      </div>

      <div style={s.card}>
        <div style={s.sectionTitle}>2. Ask a question</div>
        <textarea style={{ ...s.input, minHeight: 80 }}
          placeholder="What was the total revenue? What are the key risks?"
          value={query}
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleQuery(); } }}
        />
        <button style={querying || !query.trim() ? s.buttonOff : s.button}
          onClick={handleQuery} disabled={querying || !query.trim()}>
          {querying && <span className="spinner" />}
          {querying ? "Searching..." : "Ask"}
        </button>
        {!docId && <div style={{ fontSize: 12, color: "#666", marginTop: 8 }}>No document loaded — searching all ingested documents</div>}
      </div>

      {error && <div style={s.error}>{error}</div>}

      {result && (
        <div style={s.card}>
          <div style={s.sectionTitle}>Answer</div>
          {result.is_fallback ? (
            <div style={s.fallback}>{result.answer}</div>
          ) : (
            <>
              <div style={s.answerText}>{result.answer}</div>
              {result.source_text && (
                <div style={s.citationBox}>
                  <div style={s.citationLabel}>Source — page {result.source_page} · {result.source_chunk_id}</div>
                  <div style={s.citationText}>{result.source_text}</div>
                </div>
              )}
              <div style={{ marginTop: 16 }}>
                <ConfidenceBar value={result.confidence} />
              </div>
              <div style={s.meta}>
                <div style={s.metaItem}>Latency <span style={s.metaValue}>{result.latency_ms}ms</span></div>
                <div style={s.metaItem}>Provider <span style={s.metaValue}>{result.llm_provider}</span></div>
                <div style={s.metaItem}>Page <span style={s.metaValue}>{result.source_page}</span></div>
              </div>
              <div style={s.feedbackRow}>
                <span style={s.feedbackLabel}>Was this helpful?</span>
                <button style={s.feedbackBtn} onClick={() => handleFeedback(1)}>
                  {feedback === 1 ? "✅" : "👍"}
                </button>
                <button style={s.feedbackBtn} onClick={() => handleFeedback(-1)}>
                  {feedback === -1 ? "❌" : "👎"}
                </button>
                {feedback !== null && <span style={{ fontSize: 12, color: "#666" }}>Recorded</span>}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />)
</script>
</body>
</html>
