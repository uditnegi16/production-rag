name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          CHROMA_PERSIST_PATH: ./data/processed/chroma_test
          POSTGRES_URL: sqlite:///./data/processed/test.db
        run: pytest tests/integration/ -v

      - name: Run evaluation benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
        run: |
          python -c "
          import json
          with open('tests/evaluation/eval_results.json') as f:
              results = json.load(f)
          passed = sum(1 for r in results if r.get('status') == 'PASS')
          total = len(results)
          rate = passed / total * 100
          print(f'Pass rate: {rate}%')
          assert rate >= 90, f'Eval pass rate {rate}% is below 90% threshold'
          print('Benchmark passed')
          "